experiment: cartpole_vqc
env_id: CartPole-v1
agent: dqn_vqc
seeds: [0, 1, 2, 3, 4]
episodes: 500
gamma: 0.99
learning_rate: 0.001
batch_size: 64
buffer_size: 50000
target_update_interval: 500
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 10000
model:
  n_qubits: 4
  n_layers: 3
  encoding: angle
  data_reuploading: true
  entanglement: ring_cnot
  readout: pauli_z_linear
  backend: default.qubit
outputs_dir: outputs
